[env:cyd]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.39/platform-espressif32.zip
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 460800

lib_deps =
  bodmer/TFT_eSPI@^2.5.43
  bblanchon/ArduinoJson@^7.0.4
  https://github.com/Bodmer/U8g2_for_TFT_eSPI.git#a170ef8b6d8414b1ee2ecc97b5b913e08f5597ac

build_flags =
  -D USER_SETUP_LOADED
  -D ILI9341_2_DRIVER
  -D TFT_WIDTH=240
  -D TFT_HEIGHT=320
  -D TFT_BACKLIGHT_ON=HIGH
  -D TFT_INVERSION_ON
  -D LOAD_GLCD=1
  -D LOAD_FONT2=1
  -D LOAD_FONT4=1
  -D LOAD_FONT7=1
  -D TFT_MOSI=13
  -D TFT_SCLK=14
  -D TFT_CS=15
  -D TFT_DC=2
  -D TFT_RST=12
  -D TFT_BL=21
  -D SPI_FREQUENCY=55000000
  -D SPI_READ_FREQUENCY=20000000


